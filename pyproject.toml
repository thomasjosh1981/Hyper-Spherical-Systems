[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hyper-spherical"
version = "7.4.0"
description = "Hyper-Spherical Systems — CCFS, ISSI Token Optimizer & 4D Hyperspherical Memory"
authors = [{ name = "twiztedsocal & Antigravity" }]
dependencies = [
    "PySide6>=6.5.0",
    "numpy>=1.24.0",
    "zstandard>=0.21.0",
    "psutil>=5.9.0"
]

[tool.pyright]
include = ["gui", "tools", "src", "tests", "."]
extraPaths = [
    ".",
    "gui",
    "gui/pirate_gui",
    "tools",
    "src"
]
pythonVersion = "3.11"
pythonPlatform = "Windows"

[tool.pylance]
extraPaths = [
    ".",
    "gui",
    "gui/pirate_gui",
    "tools",
    "src"
]
